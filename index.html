<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read Me When...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3E8;
  --cream-deep:#F3E6D3;
  --ink:#4A3F35;
  --ink-soft:#7C6E5F;
  --card-shadow: 0 14px 34px rgba(120,90,50,0.10);

  /* mood palettes */
  --happy-a:#FDE9B0; --happy-b:#FBF0CE; --happy-ink:#8A6A17; --happy-icon:#F7C948;
  --thankful-a:#D9E8CB; --thankful-b:#EAF3E1; --thankful-ink:#4C6B37; --thankful-icon:#8FBE6C;
  --angry-a:#F6D3D1; --angry-b:#FBE7E5; --angry-ink:#9C4A42; --angry-icon:#E38178;
  --anxious-a:#CFE6DE; --anxious-b:#E3F1EC; --anxious-ink:#3E7566; --anxious-icon:#6FAF9B;
  --lonely-a:#E2D6EE; --lonely-b:#EFE7F6; --lonely-ink:#6A4E8C; --lonely-icon:#A57FCB;
  --sad-a:#CFDCEE; --sad-b:#E3EBF6; --sad-ink:#3E5A80; --sad-icon:#6E93BE;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  min-height:100%;
  font-family:'Nunito Sans', sans-serif;
  background:var(--cream);
  color:var(--ink);
}

/* ---------- PAGE / HERO ---------- */
#page{
  max-width:1080px;
  margin:0 auto;
  padding: 72px 32px 48px;
  background:
    radial-gradient(60% 45% at 18% 0%, rgba(255,244,220,.9), rgba(255,244,220,0) 60%),
    radial-gradient(60% 45% at 82% 6%, rgba(233,224,247,.7), rgba(233,224,247,0) 60%);
}

.hero{ text-align:center; max-width:640px; margin:0 auto 56px; }
.hero-heart{ font-size:24px; color:#D8A9A0; margin-bottom:10px; }

h1.title{
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(42px, 6vw, 64px);
  margin:0 0 14px;
  color:var(--ink);
  letter-spacing:.5px;
  line-height:1.05;
}
.subtitle{
  font-size:17px;
  line-height:1.6;
  color:var(--ink-soft);
  margin:0;
  max-width:480px;
  margin:0 auto;
}

/* ---------- MOOD GRID ---------- */
.mood-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:22px;
  max-width:920px;
  margin:0 auto;
}
.mood-card{
  border:none;
  border-radius:24px;
  padding:34px 20px 28px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px;
  cursor:pointer;
  font-family:'Nunito Sans', sans-serif;
  font-size:18px;
  font-weight:700;
  box-shadow: var(--card-shadow);
  transition: transform .2s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.mood-card:hover{
  transform: translateY(-6px);
  box-shadow: 0 20px 40px rgba(120,90,50,0.16);
}
.mood-card:active{ transform: translateY(-2px) scale(.98); }
.mood-card:focus-visible{ outline:3px solid rgba(0,0,0,.35); outline-offset:3px; }

.mood-card .icon{
  width:72px; height:72px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
  overflow:hidden;
}
.icon-photo{
  width:100%; height:100%;
  object-fit:cover;
  object-position:center 30%;
  display:block;
  border-radius:50%;
}
.mood-card .icon:has(.icon-photo){
  box-shadow: 0 0 0 3px rgba(255,255,255,.7);
}
.mood-card.happy{ background:linear-gradient(160deg,var(--happy-a),var(--happy-b)); color:var(--happy-ink); }
.mood-card.happy .icon{ background:var(--happy-icon); }
.mood-card.thankful{ background:linear-gradient(160deg,var(--thankful-a),var(--thankful-b)); color:var(--thankful-ink); }
.mood-card.thankful .icon{ background:var(--thankful-icon); }
.mood-card.angry{ background:linear-gradient(160deg,var(--angry-a),var(--angry-b)); color:var(--angry-ink); }
.mood-card.angry .icon{ background:var(--angry-icon); }
.mood-card.anxious{ background:linear-gradient(160deg,var(--anxious-a),var(--anxious-b)); color:var(--anxious-ink); }
.mood-card.anxious .icon{ background:var(--anxious-icon); }
.mood-card.lonely{ background:linear-gradient(160deg,var(--lonely-a),var(--lonely-b)); color:var(--lonely-ink); }
.mood-card.lonely .icon{ background:var(--lonely-icon); }
.mood-card.sad{ background:linear-gradient(160deg,var(--sad-a),var(--sad-b)); color:var(--sad-ink); }
.mood-card.sad .icon{ background:var(--sad-icon); }

.home-footer{
  text-align:center;
  margin-top:64px;
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:19px;
  color:var(--ink-soft);
}
.home-footer p{ margin:0; }
.home-footer .ref{ display:block; font-size:13px; margin-top:6px; font-style:normal; letter-spacing:.4px; opacity:.75; }

/* ---------- MODAL OVERLAY ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(40,30,20,.42);
  backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:32px;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  z-index:50;
}
.overlay.active{ opacity:1; pointer-events:auto; }

.modal{
  width:100%;
  max-width:460px;
  max-height:88vh;
  overflow:auto;
  border-radius:28px;
  position:relative;
  box-shadow:0 30px 70px rgba(0,0,0,.28);
  transform: translateY(18px) scale(.97);
  opacity:0;
  transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .25s ease;
}
.overlay.active .modal{ transform: translateY(0) scale(1); opacity:1; }

.modal-inner{
  padding: 30px 30px 34px;
  display:flex; flex-direction:column;
  position:relative; z-index:1;
}

.close-btn{
  position:absolute; top:18px; right:18px;
  width:38px; height:38px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.55);
  color:inherit;
  font-size:15px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  z-index:2;
  transition: background .15s ease, transform .15s ease;
}
.close-btn:hover{ background:rgba(255,255,255,.85); transform:scale(1.06); }

.detail-header{ text-align:center; margin-top:8px; }
.mood-icon-lg{
  width:56px; height:56px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
  margin:0 auto 12px;
  overflow:hidden;
}
.mood-icon-lg.has-photo{
  width:92px; height:92px;
  box-shadow: 0 0 0 4px rgba(255,255,255,.75), 0 10px 24px rgba(0,0,0,.15);
}
.mood-name{
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:600;
  font-size:36px;
  margin:0 0 6px;
}
.mood-tag{
  font-size:14px;
  opacity:.8;
  margin:0;
}

.verse-card{
  background:rgba(255,255,255,.88);
  border-radius:20px;
  padding:28px 24px;
  text-align:center;
  box-shadow:0 12px 30px rgba(60,40,20,.12);
  margin: 26px 0 18px;
  min-height:150px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px;
  transition: opacity .22s ease, transform .22s ease;
}
.verse-card.swap{ opacity:0; transform:translateY(6px); }
.verse-text{
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:21px;
  line-height:1.55;
  margin:0;
  color:#3c332b;
}
.verse-ref{
  font-family:'Nunito Sans', sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:.3px;
  color:var(--ink-soft);
}

.dots{
  display:flex; justify-content:center; gap:6px;
  margin-bottom:22px;
}
.dots span{
  width:6px; height:6px; border-radius:50%;
  background:rgba(0,0,0,.18);
}
.dots span.on{ background:rgba(0,0,0,.45); }

.actions{
  display:flex; align-items:center; justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.btn{
  border:none;
  border-radius:999px;
  padding:13px 22px;
  font-family:'Nunito Sans', sans-serif;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.7);
  color:inherit;
  transition: transform .15s ease, background .15s ease;
}
.btn:hover{ background:rgba(255,255,255,.95); }
.btn:active{ transform:scale(.95); }
.btn.saved{ background:rgba(255,255,255,.95); }
.btn.primary{ background:rgba(0,0,0,.72); color:#fff; }
.btn.primary:hover{ background:rgba(0,0,0,.85); }

.toast{
  position:absolute;
  left:50%; bottom:20px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,26,20,.9);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
  white-space:nowrap;
  z-index:3;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* mood backgrounds for the modal */
.bg-happy{ background:linear-gradient(180deg,#FCE7A9 0%, #F8D67E 45%, #F3C46A 100%); color:#5C4415; }
.bg-thankful{ background:linear-gradient(180deg,#E7F1DD 0%, #CFE3BE 55%, #AFCB98 100%); color:#3E5A2C; }
.bg-angry{ background:linear-gradient(180deg,#F7DAD6 0%, #EFB9B4 55%, #D98F89 100%); color:#6E2F28; }
.bg-anxious{ background:linear-gradient(180deg,#DCEEE7 0%, #BEDDD1 55%, #96C1B2 100%); color:#2E5747; }
.bg-lonely{ background:linear-gradient(180deg,#3B3159 0%, #5B4A82 50%, #8A72B3 100%); color:#F1EAFB; }
.bg-sad{ background:linear-gradient(180deg,#C6D6E8 0%, #A9C0DA 55%, #86A6C8 100%); color:#233A54; }

.bg-happy .verse-ref, .bg-thankful .verse-ref, .bg-angry .verse-ref, .bg-anxious .verse-ref{ color:inherit; opacity:.65; }
.bg-lonely .verse-card, .bg-sad .verse-card{ background:rgba(255,255,255,.94); }
.bg-lonely .verse-text, .bg-sad .verse-text{ color:#3c332b; }

.icon-happy{ background:#F7C948; }
.icon-thankful{ background:#8FBE6C; }
.icon-angry{ background:#E38178; }
.icon-anxious{ background:#6FAF9B; }
.icon-lonely{ background:#A57FCB; }
.icon-sad{ background:#6E93BE; color:#fff; }

/* ---------- RESPONSIVE ---------- */
@media (max-width: 860px){
  .mood-grid{ grid-template-columns:repeat(2, 1fr); }
  #page{ padding: 56px 24px 40px; }
}
@media (max-width: 520px){
  #page{ padding: 44px 18px 32px; }
  .hero{ margin-bottom:38px; }
  .overlay{ padding:0; align-items:flex-end; }
  .modal{ max-width:none; max-height:92vh; border-radius:28px 28px 0 0; }
}

@media (prefers-reduced-motion: reduce){
  .overlay, .modal, .verse-card, .mood-card{ transition:none !important; }
}

/* ---------- FAVORITES FAB (home screen) ---------- */
.fav-fab{
  position:absolute;
  top:28px; right:28px;
  display:flex; align-items:center; gap:6px;
  border:none;
  border-radius:999px;
  padding:10px 16px;
  background:rgba(255,255,255,.7);
  box-shadow:0 8px 20px rgba(120,90,50,.12);
  cursor:pointer;
  font-family:'Nunito Sans', sans-serif;
  font-weight:700;
  font-size:13px;
  color:#B15E58;
  transition: transform .15s ease, background .15s ease;
}
.fav-fab:hover{ background:rgba(255,255,255,.95); transform:translateY(-2px); }
.fav-fab:active{ transform:scale(.95); }
.fav-fab-heart{ font-size:18px; line-height:1; }
.fav-fab-count{
  background:#B15E58;
  color:#fff;
  border-radius:999px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  font-size:11px;
  display:flex; align-items:center; justify-content:center;
}
.hero{ position:relative; }
@media (max-width: 520px){
  .fav-fab{ top:14px; right:14px; padding:8px 12px; }
}

/* ---------- FAVORITE HEART BUTTON (in verse card) ---------- */
.verse-card{ position:relative; }
.heart-btn{
  position:absolute;
  top:14px; right:14px;
  border:none;
  background:rgba(0,0,0,.06);
  width:38px; height:38px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:19px;
  color:#B15E58;
  cursor:pointer;
  transition: transform .15s ease, background .15s ease, color .15s ease;
}
.heart-btn:hover{ background:rgba(0,0,0,.1); transform:scale(1.08); }
.heart-btn:active{ transform:scale(.9); }
.heart-btn.filled{ color:#E0453B; }
.heart-btn.filled span{ animation: heartPop .28s ease; }
@keyframes heartPop{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.35); }
  100%{ transform:scale(1); }
}

/* ---------- FAVORITES LIST MODAL ---------- */
.fav-header-icon{ background:#F6D9D6; color:#E0453B; }
.fav-list{
  display:flex; flex-direction:column;
  gap:12px;
  margin-top:22px;
  max-height:52vh;
  overflow-y:auto;
  padding-right:4px;
}
.fav-item{
  background:rgba(255,255,255,.85);
  border-radius:16px;
  padding:16px 44px 16px 16px;
  position:relative;
  text-align:left;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(60,40,20,.08);
  transition: transform .15s ease, background .15s ease;
}
.fav-item:hover{ background:#fff; transform:translateY(-2px); }
.fav-item-mood{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:.4px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.fav-item-photo{
  width:18px; height:18px;
  border-radius:50%;
  vertical-align:middle;
}
.fav-item-text{
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:17px;
  line-height:1.5;
  margin:0 0 6px;
  color:#3c332b;
}
.fav-item-ref{
  font-size:12px;
  font-weight:700;
  color:var(--ink-soft);
}
.fav-remove{
  position:absolute;
  top:12px; right:10px;
  border:none;
  background:none;
  color:#B15E58;
  font-size:17px;
  cursor:pointer;
  width:30px; height:30px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.fav-remove:hover{ background:rgba(0,0,0,.06); }
.fav-empty{
  text-align:center;
  color:var(--ink-soft);
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:17px;
  padding:30px 10px;
}

</style>
</head>
<body>

<div id="page">
  <div class="hero">
    <button class="fav-fab" id="favFab" aria-label="View saved verses">
      <span class="fav-fab-heart" id="favFabHeart">&#9825;</span>
      <span class="fav-fab-count" id="favFabCount" hidden>0</span>
    </button>
    <div class="hero-heart">&#10084;</div>
    <h1 class="title">Read Me When...</h1>
    <p class="subtitle">Whatever you're feeling right now, there's a verse waiting for you. Choose the word that fits this moment.</p>
  </div>

  <div class="mood-grid" id="moodGrid"></div>

  <div class="home-footer">
    <p>“He heals the brokenhearted and binds up their wounds.”</p>
    <span class="ref">Psalm 147:3</span>
  </div>
</div>

<!-- ---------- VERSE DETAIL MODAL ---------- -->
<div class="overlay" id="overlay">
  <div class="modal" id="detailBg">
    <div class="modal-inner">
      <button class="close-btn" id="backBtn" aria-label="Close">&#10005;</button>

      <div class="detail-header">
        <div class="mood-icon-lg" id="moodIconLg"></div>
        <h2 class="mood-name" id="moodName"></h2>
        <p class="mood-tag" id="moodTag"></p>
      </div>

      <div class="verse-card" id="verseCard">
        <button class="heart-btn" id="saveBtn" aria-label="Save this verse to favorites">
          <span id="heartIcon">&#9825;</span>
        </button>
        <p class="verse-text" id="verseText"></p>
        <p class="verse-ref" id="verseRef"></p>
      </div>

      <div class="dots" id="dots"></div>

      <div class="actions">
        <button class="btn primary" id="nextBtn">Another verse</button>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<!-- ---------- FAVORITES LIST MODAL ---------- -->
<div class="overlay" id="favOverlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="close-btn" id="favBackBtn" aria-label="Close">&#10005;</button>
      <div class="detail-header">
        <div class="mood-icon-lg fav-header-icon">&#9829;</div>
        <h2 class="mood-name">Your Verses</h2>
        <p class="mood-tag">Saved for the moments that need them.</p>
      </div>
      <div class="fav-list" id="favList"></div>
    </div>
  </div>
</div>

<script>
(function(){

  const MOODS = {
    happy: {
      label: "Happy",

      bg: "bg-happy",
      iconClass: "icon-happy",
      verses: [
        ["This is the day that the Lord has made; let us rejoice and be glad in it.", "Psalm 118:24"],
        ["The joy of the Lord is your strength.", "Nehemiah 8:10"],
        ["You make known to me the path of life; in your presence there is fullness of joy.", "Psalm 16:11"],
        ["Every good gift and every perfect gift is from above, coming down from the Father of lights.", "James 1:17"],
        ["Shout for joy to the Lord, all the earth. Worship the Lord with gladness.", "Psalm 100:1-2"],
        ["A joyful heart is good medicine, but a crushed spirit dries up the bones.", "Proverbs 17:22"],
        ["The Lord your God is with you, the Mighty Warrior who saves. He will rejoice over you with gladness.", "Zephaniah 3:17"],
        ["The Lord is my strength and my shield; my heart trusts in him, and he helps me. My heart leaps for joy.", "Psalm 28:7"],
        ["I have told you this so that my joy may be in you and that your joy may be complete.", "John 15:11"],
        ["Rejoice in the Lord always. I will say it again: Rejoice!", "Philippians 4:4"],
        ["Weeping may stay for the night, but rejoicing comes in the morning.", "Psalm 30:5"],
        ["Let the heavens rejoice, let the earth be glad; let them say among the nations, the Lord reigns!", "1 Chronicles 16:31"],
        ["But let all who take refuge in you be glad; let them ever sing for joy.", "Psalm 5:11"],
        ["I delight greatly in the Lord; my soul rejoices in my God.", "Isaiah 61:10"],
        ["May the God of hope fill you with all joy and peace as you trust in him.", "Romans 15:13"],
        ["Sing unto God, sing praises to his name: extol him that rideth upon the heavens, and rejoice before him.", "Psalm 68:4"],
        ["Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with gladness.", "Psalm 30:11"],
        ["Then was our mouth filled with laughter, and our tongue with singing.", "Psalm 126:2"],

      bg: "bg-sad",
      iconClass: "icon-sad",
      verses: [
        ["He will wipe every tear from their eyes. There will be no more death or mourning or crying or pain, for the old order of things has passed away.", "Revelation 21:4"],
        ["The Lord is close to the brokenhearted and saves those who are crushed in spirit.", "Psalm 34:18"],
        ["He heals the brokenhearted and binds up their wounds.", "Psalm 147:3"],
        ["Blessed are those who mourn, for they will be comforted.", "Matthew 5:4"],
        ["Weeping may stay for the night, but rejoicing comes in the morning.", "Psalm 30:5"],
        ["Now is your time of grief, but I will see you again and you will rejoice.", "John 16:22"],
        ["Record my misery; list my tears on your scroll—are they not in your record?", "Psalm 56:8"],
        ["Those who sow with tears will reap with songs of joy.", "Psalm 126:5"],
        ["Praise be to the God of all comfort, who comforts us in all our troubles.", "2 Corinthians 1:3-4"],
        ["The righteous cry out, and the Lord hears them; he delivers them from all their troubles.", "Psalm 34:17"],
        ["He has sent me to bind up the brokenhearted, to comfort all who mourn.", "Isaiah 61:1-2"],
        ["Why, my soul, are you downcast? Put your hope in God, for I will yet praise him.", "Psalm 42:11"],
        ["Because of the Lord's great love we are not consumed, for his compassions never fail.", "Lamentations 3:22"],
        ["Jesus wept.", "John 11:35"],
        ["You keep track of all my sorrows. You have collected all my tears in your bottle.", "Psalm 56:8"],
        ["The Lord hath heard my supplication; the Lord will receive my prayer.", "Psalm 6:9"],
        ["Surely he hath borne our griefs, and carried our sorrows.", "Isaiah 53:4"],
        ["Many are the afflictions of the righteous: but the Lord delivereth him out of them all.", "Psalm 34:19"],
        ["Thou, which hast shewed me great and sore troubles, shalt quicken me again.", "Psalm 71:20"],
        ["O Lord my God, I cried unto thee, and thou hast healed me.", "Psalm 30:2"],
        ["We are troubled on every side, yet not distressed; we are perplexed, but not in despair.", "2 Corinthians 4:8"],
        ["Hear me speedily, O Lord: my spirit faileth: hide not thy face from me.", "Psalm 143:7"],
        ["As one whom his mother comforteth, so will I comfort you.", "Isaiah 66:13"],
        ["My soul melteth for heaviness: strengthen thou me according unto thy word.", "Psalm 119:28"],
        ["I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.", "Romans 8:18"],
        ["The God of all grace... shall himself perfect, stablish, strengthen, settle you.", "1 Peter 5:10"],
        ["I waited patiently for the Lord; and he inclined unto me, and heard my cry.", "Psalm 40:1"],
        ["Let not your heart be troubled: ye believe in God, believe also in me.", "John 14:1"],
        ["Hear my cry, O God; attend unto my prayer... lead me to the rock that is higher than I.", "Psalm 61:1-2"],
        ["He will swallow up death in victory; and the Lord God will wipe away tears off all faces.", "Isaiah 25:8"]
      ]
    }
  };

  const FAV_KEY = 'readMeWhenFavorites';

  function loadFavorites(){
    try{
      const raw = localStorage.getItem(FAV_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveFavorites(list){
    try{
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
    }catch(e){ /* storage unavailable, fail silently */ }
  }

  let favorites = loadFavorites();

  const grid = document.getElementById('moodGrid');
  Object.keys(MOODS).forEach(key => {
    const m = MOODS[key];
    const card = document.createElement('button');
    card.className = 'mood-card ' + key;
    const iconInner = m.photo
      ? `<img src="${m.photo}" alt="" class="icon-photo">`
      : m.icon;
    card.innerHTML = `<span class="icon">${iconInner}</span><span>${m.label}</span>`;
    card.addEventListener('click', () => openMood(key));
    grid.appendChild(card);
  });

  const overlay = document.getElementById('overlay');
  const detailBg = document.getElementById('detailBg');
  const moodIconLg = document.getElementById('moodIconLg');
  const moodName = document.getElementById('moodName');
  const moodTag = document.getElementById('moodTag');
  const verseCard = document.getElementById('verseCard');
  const verseText = document.getElementById('verseText');
  const verseRef = document.getElementById('verseRef');
  const dotsWrap = document.getElementById('dots');
  const saveBtn = document.getElementById('saveBtn');
  const heartIcon = document.getElementById('heartIcon');
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');
  const toast = document.getElementById('toast');

  const favFab = document.getElementById('favFab');
  const favFabHeart = document.getElementById('favFabHeart');
  const favFabCount = document.getElementById('favFabCount');
  const favOverlay = document.getElementById('favOverlay');
  const favBackBtn = document.getElementById('favBackBtn');
  const favList = document.getElementById('favList');

  let currentMood = null;
  let currentIndex = 0;

  function pickRandomIndex(total, exceptIndex){
    if(total <= 1) return 0;
    let idx;
    do { idx = Math.floor(Math.random() * total); } while (idx === exceptIndex);
    return idx;
  }

  function renderDots(total, active){
    dotsWrap.innerHTML = '';
    const maxDots = Math.min(total, 6);
    for(let i=0;i<maxDots;i++){
      const d = document.createElement('span');
      if(i === (active % maxDots)) d.className = 'on';
      dotsWrap.appendChild(d);
    }
  }

  function favIndex(moodKey, idx){
    return favorites.findIndex(v => v.mood === moodKey && v.idx === idx);
  }

  function isFavorited(moodKey, idx){
    return favIndex(moodKey, idx) !== -1;
  }

  function updateFavFab(){
    if(favorites.length > 0){
      favFabHeart.innerHTML = '&#9829;';
      favFabHeart.style.color = '#E0453B';
      favFabCount.hidden = false;
      favFabCount.textContent = favorites.length;
    } else {
      favFabHeart.innerHTML = '&#9825;';
      favFabHeart.style.color = '';
      favFabCount.hidden = true;
    }
  }

  function updateSaveBtn(){
    if(isFavorited(currentMood, currentIndex)){
      saveBtn.classList.add('filled');
      heartIcon.innerHTML = '&#9829;';
      saveBtn.setAttribute('aria-label', 'Remove this verse from favorites');
    } else {
      saveBtn.classList.remove('filled');
      heartIcon.innerHTML = '&#9825;';
      saveBtn.setAttribute('aria-label', 'Save this verse to favorites');
    }
  }

  function showVerse(moodKey, idx, animate){
    const m = MOODS[moodKey];
    const [text, ref] = m.verses[idx];
    const render = () => {
      verseText.textContent = '“' + text + '”';
      verseRef.textContent = ref;
      renderDots(m.verses.length, idx);
      updateSaveBtn();
      if(animate) verseCard.classList.remove('swap');
    };
    if(animate){
      verseCard.classList.add('swap');
      setTimeout(render, 180);
    } else {
      render();
    }
  }

  function openMood(key, forcedIndex){
    const m = MOODS[key];
    currentMood = key;
    currentIndex = (typeof forcedIndex === 'number') ? forcedIndex : Math.floor(Math.random() * m.verses.length);

    detailBg.className = 'detail-bg ' + m.bg;
    moodIconLg.className = 'mood-icon-lg ' + m.iconClass + (m.photo ? ' has-photo' : '');
    moodIconLg.innerHTML = m.photo ? `<img src="${m.photo}" alt="" class="icon-photo">` : m.icon;
    moodName.textContent = m.label;
    moodTag.textContent = m.tag;

    showVerse(key, currentIndex, false);
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail(){
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  // close when clicking the dimmed backdrop (not the modal itself)
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeDetail();
  });

  // close on Escape
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(overlay.classList.contains('active')) closeDetail();
      if(favOverlay.classList.contains('active')) closeFavorites();
    }
  });

  nextBtn.addEventListener('click', () => {
    const m = MOODS[currentMood];
    currentIndex = pickRandomIndex(m.verses.length, currentIndex);
    showVerse(currentMood, currentIndex, true);
  });

  saveBtn.addEventListener('click', () => {
    const idxInFavs = favIndex(currentMood, currentIndex);
    if(idxInFavs !== -1){
      favorites.splice(idxInFavs, 1);
      saveFavorites(favorites);
      updateSaveBtn();
      updateFavFab();
      showToast('Removed from favorites');
    } else {
      const [text, ref] = MOODS[currentMood].verses[currentIndex];
      favorites.push({ mood: currentMood, idx: currentIndex, text, ref, label: MOODS[currentMood].label });
      saveFavorites(favorites);
      updateSaveBtn();
      updateFavFab();
      showToast('Saved to favorites');
    }
  });

  backBtn.addEventListener('click', closeDetail);

  // ---------- FAVORITES LIST ----------
  function renderFavList(){
    favList.innerHTML = '';
    if(favorites.length === 0){
      const empty = document.createElement('div');
      empty.className = 'fav-empty';
      empty.textContent = "You haven't saved any verses yet. Tap the heart on a verse to keep it here.";
      favList.appendChild(empty);
      return;
    }
    favorites.forEach((fav, i) => {
      const item = document.createElement('div');
      item.className = 'fav-item';

      const moodLabel = document.createElement('div');
      moodLabel.className = 'fav-item-mood';
      const m = MOODS[fav.mood];
      const favIconInner = m && m.photo
        ? `<img src="${m.photo}" alt="" class="icon-photo fav-item-photo">`
        : (m ? m.icon : '');
      moodLabel.innerHTML = `<span>${favIconInner}</span><span>${fav.label || (m ? m.label : '')}</span>`;

      const text = document.createElement('p');
      text.className = 'fav-item-text';
      text.textContent = '“' + fav.text + '”';

      const ref = document.createElement('p');
      ref.className = 'fav-item-ref';
      ref.textContent = fav.ref;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'fav-remove';
      removeBtn.setAttribute('aria-label', 'Remove from favorites');
      removeBtn.innerHTML = '&#10005;';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        favorites.splice(i, 1);
        saveFavorites(favorites);
        updateFavFab();
        renderFavList();
        if(overlay.classList.contains('active')) updateSaveBtn();
      });

      item.appendChild(moodLabel);
      item.appendChild(text);
      item.appendChild(ref);
      item.appendChild(removeBtn);

      item.addEventListener('click', () => {
        closeFavorites();
        openMood(fav.mood, fav.idx);
      });

      favList.appendChild(item);
    });
  }

  function openFavorites(){
    renderFavList();
    favOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeFavorites(){
    favOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  favFab.addEventListener('click', openFavorites);
  favBackBtn.addEventListener('click', closeFavorites);
  favOverlay.addEventListener('click', (e) => {
    if(e.target === favOverlay) closeFavorites();
  });

  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  updateFavFab();

})();

</script>
</body>
</html>
